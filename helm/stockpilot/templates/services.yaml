apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockpilot.fullname" . }}-backend
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    {{- include "stockpilot.backendSelector" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stockpilot.backendSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockpilot.fullname" . }}-frontend
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    {{- include "stockpilot.frontendSelector" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stockpilot.frontendSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
