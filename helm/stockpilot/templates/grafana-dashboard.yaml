{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up automatically by the Grafana sidecar in kube-prometheus-stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockpilot.fullname" . }}-grafana-dashboard
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  stockpilot.json: |-
{{ .Files.Get "dashboards/stockpilot.json" | indent 4 }}
{{- end }}
