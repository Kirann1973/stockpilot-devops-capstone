{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stockpilot.fullname" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          # /api/* -> FastAPI backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockpilot.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
          # everything else -> React frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockpilot.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}
