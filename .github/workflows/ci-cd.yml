name: StockPilot CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.65.0

jobs:
  # ---------- Stage 1: quality gate ----------
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest (fails the pipeline on any failing test)
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # ---------- Stage 2: build, scan, push ----------
  build-scan-push:
    name: Build, Trivy scan, push to GHCR
    needs: [test, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names (GHCR needs a lowercase owner)
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${REGISTRY}/${owner}/stockpilot-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${owner}/stockpilot-frontend" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }} ./backend

      - name: Build frontend image
        run: |
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }} ./frontend

      - name: Trivy scan backend image (fail on HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }}

      - name: Trivy scan frontend image (fail on HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scanned images passed the gate; now publish them for both amd64 (EKS, Intel)
      # and arm64 (Apple Silicon Minikube) under the same commit-SHA tag.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'

      - name: Push multi-arch images tagged with the commit SHA
        if: github.event_name != 'pull_request'
        run: |
          for svc in backend frontend; do
            if [ "$svc" = backend ]; then image=${{ steps.meta.outputs.backend }}; else image=${{ steps.meta.outputs.frontend }}; fi
            docker buildx build --platform linux/amd64,linux/arm64 \
              --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
              --label org.opencontainers.image.revision=${{ github.sha }} \
              -t "$image:${{ steps.meta.outputs.tag }}" --push "./$svc"
          done
          {
            echo "### Published images (linux/amd64 + linux/arm64)"
            echo "- \`${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- Stage 3a: GitOps - record the new image tag in Git for Argo CD ----------
  gitops-bump:
    name: "GitOps: bump image tag for Argo CD"
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Commit the new tag to helm/stockpilot/values-gitops.yaml
        run: |
          tag=${{ needs.build-scan-push.outputs.tag }}
          sed -i "s/^  tag: .*/  tag: \"${tag}\"/" helm/stockpilot/values-gitops.yaml
          git diff --quiet && { echo "Tag already ${tag}"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${tag::7} via Argo CD [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "### Argo CD will deploy \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------- Stage 3b: deploy with Helm (runs only when a cluster is configured) ----------
  deploy:
    name: Deploy with Helm
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no cluster credentials are configured
        if: env.KUBE_CONFIG_DATA == ''
        run: echo "::notice::KUBE_CONFIG_DATA secret not set - skipping deploy. Deploy locally with helm (see README)."

      - uses: azure/setup-helm@v4
        if: env.KUBE_CONFIG_DATA != ''

      - name: Configure kubectl
        if: env.KUBE_CONFIG_DATA != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config

      - name: helm upgrade --install
        if: env.KUBE_CONFIG_DATA != ''
        run: |
          helm upgrade --install stockpilot ./helm/stockpilot \
            --namespace stockpilot --create-namespace \
            --set image.tag=${{ needs.build-scan-push.outputs.tag }} \
            --wait --timeout 5m
