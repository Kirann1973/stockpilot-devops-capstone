# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
prometheus:
  prometheusSpec:
    # Discover ServiceMonitors in every namespace, not only those labelled for this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    retention: 2d
    resources:
      requests: { cpu: 200m, memory: 512Mi }

grafana:
  enabled: true
  adminPassword: stockpilot-admin   # demo only, change for anything real
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

alertmanager:
  enabled: false

# Trim components that are noisy or unsupported on minikube.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
