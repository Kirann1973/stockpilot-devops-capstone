apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stockpilot.fullname" . }}-backend
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    {{- include "stockpilot.backendSelector" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stockpilot.backendSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stockpilot.backendSelector" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ include "stockpilot.fullname" . }}-postgres -p 5432; do echo waiting for db; sleep 2; done"]
          securityContext:
            runAsUser: 70
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/{{ .Values.backend.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "stockpilot.fullname" . }}-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
