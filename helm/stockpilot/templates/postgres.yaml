apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockpilot.fullname" . }}-postgres
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
    {{- include "stockpilot.postgresSelector" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stockpilot.postgresSelector" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stockpilot.fullname" . }}-postgres
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "stockpilot.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "stockpilot.postgresSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stockpilot.postgresSelector" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "stockpilot.fullname" . }}-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
